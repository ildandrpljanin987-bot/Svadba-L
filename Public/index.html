<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lamija & Nedim — Naše vjenčanje</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#f8f1e5;
    color:#51483e;
    font-family:Georgia,"Times New Roman",serif;
}

body{
    overflow-x:hidden;
}

/* =========================
   POČETNA
========================= */

.hero{
    min-height:100svh;
    padding:18px;
    background:#f8f1e5;
}

.frame{
    position:relative;
    width:100%;
    min-height:calc(100svh - 36px);
    overflow:hidden;
    border:2px solid #b99b67;
    border-radius:18px;
    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.42) 0%,
            rgba(248,241,229,0) 65%
        ),
        #f8f1e5;
}

/* =========================
   CVJETNE GRANE
========================= */

.botanical{
    position:absolute;
    width:390px;
    height:650px;
    z-index:1;
    pointer-events:none;
    opacity:.82;
}

.botanical.left{
    left:-65px;
    top:-25px;
}

.botanical.right{
    right:-65px;
    bottom:-35px;
    transform:scaleX(-1);
}

.botanical svg{
    width:100%;
    height:100%;
    overflow:visible;
}

/* =========================
   SADRŽAJ
========================= */

.hero-content{
    position:relative;
    z-index:3;
    min-height:calc(100svh - 40px);
    padding:85px 25px 25px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}

.eyebrow{
    color:#4f4840;
    font-size:24px;
    letter-spacing:9px;
    margin-bottom:23px;
}

.names{
    margin:0;
    color:#9b702d;
    font-family:"Brush Script MT","Segoe Script","URW Chancery L",cursive;
    font-weight:400;
    font-size:clamp(72px,8vw,132px);
    line-height:.9;
    letter-spacing:-4px;
    white-space:nowrap;
}

.heart-row{
    width:min(540px,44%);
    min-width:300px;
    display:flex;
    align-items:center;
    gap:24px;
    margin-top:34px;
}

.heart-row::before,
.heart-row::after{
    content:"";
    flex:1;
    height:2px;
    background:#c4a875;
}

.heart{
    color:#9b702d;
    font-family:Arial,sans-serif;
    font-size:58px;
    line-height:1;
    font-weight:300;
}

.date{
    margin-top:20px;
    color:#51483e;
    font-size:30px;
    letter-spacing:13px;
}

.welcome{
    margin:43px 0 31px;
    max-width:760px;
    color:#51483e;
    font-size:24px;
    line-height:1.55;
}

.gallery-open{
    width:370px;
    max-width:80%;
    height:80px;
    border:0;
    border-radius:50px;
    background:#9a702e;
    color:white;
    font-family:Georgia,"Times New Roman",serif;
    font-size:24px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(100,70,30,.12);
}

.gallery-open:hover{
    filter:brightness(.96);
}

.camera{
    font-size:29px;
    margin-right:13px;
}

.arrow{
    color:#9a702e;
    font-size:38px;
    margin-top:24px;
}


/* =========================
   GALERIJA
========================= */

#gallery{
    display:none;
    min-height:100vh;
    padding:35px 20px 60px;
    background:#f8f1e5;
}

.gallery-inner{
    width:100%;
    max-width:1200px;
    margin:auto;
}

.gallery-title{
    margin:0;
    text-align:center;
    color:#94702e;
    font-size:42px;
}

.gallery-subtitle{
    text-align:center;
    font-size:18px;
    margin:10px 0 28px;
}

.gallery-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:25px;
}

.btn{
    border:0;
    border-radius:30px;
    padding:14px 24px;
    background:#9a702e;
    color:#fff;
    font-family:Georgia,"Times New Roman",serif;
    font-size:17px;
    cursor:pointer;
}

#photos{
    display:none;
}

.upload-box{
    max-width:850px;
    margin:0 auto 30px;
    padding:24px;
    text-align:center;
    border:1px solid #c4a875;
    border-radius:18px;
    background:rgba(255,255,255,.45);
}

.upload-box p{
    margin:7px 0;
}

.status{
    min-height:22px;
    margin-top:15px;
    color:#80602b;
    font-weight:bold;
}

.photo-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:15px;
}

.photo-card{
    overflow:hidden;
    background:white;
    border-radius:15px;
    box-shadow:0 3px 13px rgba(0,0,0,.09);
}

.photo-card img,
.photo-card video{
    display:block;
    width:100%;
    height:260px;
    object-fit:cover;
    background:#eee;
}

.download{
    width:100%;
    padding:12px;
    border:0;
    background:#9a702e;
    color:#fff;
    cursor:pointer;
}


/* =========================
   QR
========================= */

.qrbox{
    max-width:700px;
    margin:45px auto 0;
    padding:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:25px;
    border:1px solid #c4a875;
    border-radius:18px;
    background:rgba(255,255,255,.45);
}

.qrbox img{
    width:180px;
    height:180px;
    object-fit:contain;
}

.qrtext h3{
    margin-top:0;
    color:#94702e;
}


/* =========================
   PIN
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.55);
}

.modal-box{
    width:100%;
    max-width:380px;
    padding:30px;
    border-radius:20px;
    background:#f8f1e5;
    text-align:center;
}

.modal-box h2{
    color:#94702e;
}
