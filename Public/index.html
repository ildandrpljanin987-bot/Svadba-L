<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lamija & Nedim — Naše vjenčanje</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    background:#f7f0e4;
    color:#574d42;
    font-family:Georgia,"Times New Roman",serif;
}

body{overflow-x:hidden}

.hero{
    min-height:100vh;
    padding:18px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.frame{
    position:relative;
    width:100%;
    min-height:calc(100vh - 36px);
    border:2px solid #b99a62;
    border-radius:18px;
    overflow:hidden;
    background:#f7f0e4;
    text-align:center;
}

.content{
    position:relative;
    z-index:3;
    min-height:calc(100vh - 40px);
    padding:90px 20px 30px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.small{
    font-size:24px;
    letter-spacing:8px;
    margin-bottom:25px;
}

.names{
    margin:0;
    color:#9b722f;
    font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:clamp(70px,9vw,135px);
    font-weight:400;
    line-height:.9;
}

.line{
    width:min(600px,65%);
    display:flex;
    align-items:center;
    gap:20px;
    margin:30px auto 18px;
}

.line:before,.line:after{
    content:"";
    height:1.5px;
    background:#b99a62;
    flex:1;
}

.heart{
    color:#9b722f;
    font-size:50px;
}

.date{
    font-size:31px;
    letter-spacing:10px;
    margin-bottom:38px;
}

.text{
    font-size:23px;
    line-height:1.55;
    max-width:760px;
    margin:0 0 32px;
}

.open{
    border:0;
    background:#9b722f;
    color:white;
    border-radius:50px;
    width:360px;
    max-width:80%;
    height:78px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:23px;
    cursor:pointer;
}

.arrow{
    color:#9b722f;
    font-size:38px;
    margin-top:20px;
}

/* dekoracije */
.decor{
    position:absolute;
    z-index:1;
    width:270px;
    height:500px;
    opacity:.7;
}

.left{left:-55px;top:20px}
.right{right:-55px;bottom:-30px;transform:scaleX(-1) rotate(10deg)}

.stem{
    position:absolute;
    width:230px;
    height:2px;
    background:#a9ad96;
    left:0;
    top:180px;
    transform:rotate(-50deg);
    transform-origin:left;
}

.leaf{
    position:absolute;
    width:75px;
    height:35px;
    border-radius:100% 0 100% 0;
    background:#c5cab5;
}

.l1{left:35px;top:100px;transform:rotate(-55deg)}
.l2{left:95px;top:125px;transform:rotate(-20deg)}
.l3{left:25px;top:190px;transform:rotate(-65deg)}
.l4{left:105px;top:220px;transform:rotate(-5deg)}
.l5{left:50px;top:290px;transform:rotate(-65deg)}
.l6{left:120px;top:330px;transform:rotate(5deg)}
.l7{left:45px;top:395px;transform:rotate(-60deg)}

.flower{
    position:absolute;
    width:32px;
    height:32px;
    border-radius:50%;
    background:#eee8d8;
    border:2px solid #c5a66f;
}

.f1{left:80px;top:135px}
.f2{left:35px;top:250px}
.f3{left:100px;top:355px}

/* GALERIJA */

#gallery{
    display:none;
    min-height:100vh;
    padding:35px 20px 60px;
}

.gallery-inner{
    max-width:1200px;
    margin:auto;
}

h2{
    color:#95702f;
    text-align:center;
    font-size:40px;
}

.subtitle{
    text-align:center;
    font-size:18px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin:25px 0;
}

.btn{
    border:0;
    border-radius:30px;
    background:#9b722f;
    color:white;
    padding:14px 25px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:17px;
    cursor:pointer;
}

#photos{display:none}

.upload{
    max-width:800px;
    margin:auto;
    padding:25px;
    border:1px solid #c5aa76;
    border-radius:18px;
    text-align:center;
    background:rgba(255,255,255,.45);
}

.status{
    margin-top:15px;
    font-weight:bold;
}

.grid{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:15px;
}

.card{
    overflow:hidden;
    border-radius:15px;
    background:white;
}

.card img,.card video{
    width:100%;
    height:260px;
    display:block;
    object-fit:cover;
}

.download{
    width:100%;
    border:0;
    padding:12px;
    background:#9b722
