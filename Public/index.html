<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lamija & Nedim — Naše vjenčanje</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #f7f0e4;
    font-family: Georgia, "Times New Roman", serif;
}

body {
    overflow-x: hidden;
}

/* =========================
   POČETNA STRANICA
   ========================= */

.hero {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: #f7f0e4;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.hero-image {
    width: 100%;
    height: 100vh;
    object-fit: fill;
    display: block;
}

/*
   Nevidljivi klik preko dugmeta
   "Otvori galeriju" sa slike.
*/
.open-gallery {
    position: absolute;
    left: 50%;
    top: 81%;
    transform: translate(-50%, -50%);
    width: 25%;
    max-width: 380px;
    min-width: 260px;
    height: 82px;
    border-radius: 50px;
    cursor: pointer;
    z-index: 5;
    background: transparent;
    border: none;
}

/* =========================
   GALERIJA
   ========================= */

#gallery {
    display: none;
    min-height: 100vh;
    background: #f7f0e4;
    padding: 30px 20px 60px;
}

.gallery-container {
    max-width: 1200px;
    margin: auto;
}

.gallery-title {
    text-align: center;
    color: #8f6b2d;
    font-size: 42px;
    margin: 10px 0 8px;
}

.gallery-subtitle {
    text-align: center;
    color: #665746;
    font-size: 18px;
    margin-bottom: 25px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.btn {
    border: none;
    border-radius: 30px;
    padding: 14px 24px;
    background: #9a712c;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

.btn:hover {
    opacity: .9;
}

.upload-box {
    background: rgba(255,255,255,.55);
    border: 1px solid #c6ad7d;
    border-radius: 20px;
    padding: 25px;
    text-align: center;
    margin-bottom: 30px;
}

.upload-box p {
    color: #665746;
}

#photos {
    display: none;
}

.status {
    margin-top: 15px;
    color: #80602c;
    font-weight: bold;
}

.photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
}

.photo-card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.photo-card img,
.photo-card video {
    display: block;
    width: 100%;
    height: 260px;
    object-fit: cover;
    background: #eee;
}

.photo-card .download {
    display: block;
    width: 100%;
    border: 0;
    padding: 11px;
    background: #9a712c;
    color: white;
    cursor: pointer;
}

/* =========================
   PIN MODAL
   ========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-box {
    width: 100%;
    max-width: 380px;
    background: #f8f1e5;
    border-radius: 20px;
    padding: 30px;
    text-align: center;
}

.modal-box h2 {
    color: #8f6b2d;
    margin-top: 0;
}

.modal-box input {
    width: 100%;
    padding: 13px;
    border: 1px solid #c6ad7d;
    border-radius: 10px;
    font-size: 18px;
    text-align: center;
    margin: 15px 0;
}

.close {
    margin-top: 10px;
    background: #777;
}

/* =========================
   MOBILNI UREĐAJI
   ========================= */

@media (max-width: 700px) {

    .hero {
        min-height: 100svh;
    }

    .hero-image {
        width: 100%;
        height: 100svh;
        object-fit: fill;
    }

    .open-gallery {
        top: 81%;
        width: 55%;
        min-width: 0;
        height: 65px;
    }

    .gallery-title {
        font-size: 32px;
    }

    .photo-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .photo-card img,
    .photo-card video {
        height: 180px;
    }
}
</style>
</head>

<body>

<!-- =========================
     POČETNA
     ========================= -->

<section class="hero" id="home">

    <!-- OVO JE TVOJA ORIGINALNA SLIKA -->
    <img
        class="hero-image"
        src="naslovna.png"
        alt="Lamija & Nedim - Naše vjenčanje"
    >

    <!-- Nevidljivi klik preko dugmeta sa slike -->
    <button
        class="open-gallery"
        onclick="openGallery()"
        aria-label="Otvori galeriju">
    </button>

</section>


<!-- =========================
     GALERIJA
     ========================= -->

<section id="gallery">

    <div class="gallery-container">

        <h1 class="gallery-title">
            Naša svadbena galerija
        </h1>

        <p class="gallery-subtitle">
            Podijelite svoje fotografije i videe sa nama.
        </p>

        <div class="buttons">

            <label class="btn" for="photos">
                📷 Objavi fotografije i videe
            </label>

            <button
                class="btn"
                onclick="requestDownloadAll()">
                📦 Preuzmi sve
            </button>

        </div>

        <div class="upload-box">

            <p>
                Možete odabrati do <b>150 fotografija ili videa</b>
                odjednom.
            </p>

            <p>
                Fotografije do 50 MB · videi do 500 MB
            </p>

            <input
                id="photos"
                type="file"
                accept="image/*,video/mp4,video/quicktime,video/webm,video/x-m4v"
                multiple
            >

            <div
                id="status"
                class="status">
            </div>

        </div>

        <div
            id="photoGrid"
            class="photo-grid">
        </div>

    </div>

</section>


<!-- =========================
     PIN
     ========================= -->

<div
    id="pinModal"
    class="modal">

    <div class="modal-box">

        <h2>Preuzimanje fotografija</h2>

        <p>
            Unesite PIN za preuzimanje.
        </p>

        <input
            id="pin"
            type="password"
            inputmode="numeric"
            maxlength="20"
            placeholder="PIN"
        >

        <button
            class="btn"
            onclick="confirmDownload()">
            Preuzmi
        </button>

        <button
            class="btn close"
            onclick="closeModal()">
            Otkaži
        </button>

        <div
            id="pinError"
            style="color:#b33;margin-top:12px;">
        </div>

    </div>

</div>


<script>

let pendingDownload = null;


/* =========================
   OTVORI GALERIJU
   ========================= */

function openGallery() {

    document.getElementById("home").style.display = "none";

    document.getElementById("gallery").style.display = "block";

    window.scrollTo({
        top: 0,
        behavior: "instant"
    });

    loadGallery();
}


/* =========================
   UČITAVANJE GALERIJE
   ========================= */

async function loadGallery() {

    const grid = document.getElementById("photoGrid");

    grid.innerHTML = "";

    try {

        const response = await fetch("/api/photos");

        if (!response.ok) {
            throw new Error("Greška pri učitavanju galerije.");
        }

        const data = await response.json();

        const photos = Array.isArray(data)
            ? data
            : (data.photos || []);

        photos.forEach(photo => {

            const key = photo.key || photo.file;
            const url = photo.url || photoUrl(key);

            if (!key && !url) return;

            const card = document.createElement("div");

            card.className = "photo-card";

            const lower = String(key || url).toLowerCase();

            const isVideo =
                lower.endsWith(".mp4") ||
                lower.endsWith(".mov") ||
                lower.endsWith(".webm") ||
                lower.endsWith(".m4v");

            if (isVideo) {

                const video = document.createElement("video");

                video.src = url;
                video.controls = true;
                video.preload = "metadata";

                card.appendChild(video);

            } else {

                const img = document.createElement("img");

                img.src = url;
                img.loading = "lazy";

                img.onclick = () => {
                    window.open(url, "_blank");
                };

                card.appendChild(img);
            }

            const download = document.createElement("button");

            download.className = "download";

            download.textContent = "📥 Preuzmi";

            download.onclick = () => {
                requestDownload(key);
            };

            card.appendChild(download);

            grid.appendChild(card);

        });

    } catch (error) {

        grid.innerHTML =
            "<p style='text-align:center;color:#8a6a35;'>Galerija trenutno nije dostupna.</p>";

        console.error(error);
    }
}


/* =========================
   URL SLIKE / VIDEA
   ========================= */

function photoUrl(key) {

    if (!key) return "";

    return "/uploads/" +
        key
            .split("/")
            .map(part => encodeURIComponent(part))
            .join("/");
}


/* =========================
   UPLOAD
   ========================= */

document
    .getElementById("photos")
    .addEventListener("change", async function() {

        const files = Array.from(this.files);

        const status = document.getElementById("status");

        if (!files.length) return;

        if (files.length > 150) {

            status.textContent =
                "Možete odabrati najviše 150 fajlova.";

            this.value = "";

            return;
        }

        const formData = new FormData();

        files.forEach(file => {

            formData.append("photos", file);

        });

        status.textContent =
            "⏳ Slanje je u toku...";

        try {

            const response = await fetch(
                "/api/upload",
                {
                    method: "POST",
                    body: formData
                }
            );

            const data = await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Upload nije uspio."
                );
            }

            status.textContent =
                "✅ Uspješno poslano: " +
                (data.uploaded || files.length) +
                " fajlova.";

            this.value = "";

            await loadGallery();

        } catch (error) {

            status.textContent =
                "❌ " + error.message;

            console.error(error);
        }

    });


/* =========================
   DOWNLOAD JEDNOG
   ========================= */

function requestDownload(key) {

    pendingDownload = {
        type: "single",
        key: key
    };

    document.getElementById("pin").value = "";

    document.getElementById("pinError").textContent = "";

    document.getElementById("pinModal").style.display = "flex";

}


/* =========================
   DOWNLOAD SVE
   ========================= */

function requestDownloadAll() {

    pendingDownload = {
        type: "all"
    };

    document.getElementById("pin").value = "";

    document.getElementById("pinError").textContent = "";

    document.getElementById("pinModal").style.display = "flex";

}


/* =========================
   POTVRDA PINA
   ========================= */

async function confirmDownload() {

    const pin =
        document.getElementById("pin").value;

    const error =
        document.getElementById("pinError");

    if (!pin) {

        error.textContent =
            "Unesite PIN.";

        return;
    }

    try {

        if (pendingDownload.type === "all") {

            const response = await fetch(
                "/api/download-all",
                {
                    headers: {
                        "x-admin-pin": pin
                    }
                }
            );

            if (!response.ok) {

                const data = await response.json()
                    .catch(() => ({}));

                throw new Error(
                    data.error || "Pogrešan PIN."
                );
            }

            const blob =
                await response.blob();

            const url =
                URL.createObjectURL(blob);

            const a =
                document.createElement("a");

            a.href = url;

            a.download =
                "lamija-nedim-galerija.zip";

            document.body.appendChild(a);

            a.click();

            a.remove();

            URL.revokeObjectURL(url);

        } else {

            const response = await fetch(
                "/api/download?key=" +
                encodeURIComponent(
                    pendingDownload.key
                ),
                {
                    headers: {
                        "x-admin-pin": pin
                    }
                }
            );

            if (!response.ok) {

                const data = await response.json()
                    .catch(() => ({}));

                throw new Error(
                    data.error || "Pogrešan PIN."
                );
            }

            const blob =
                await response.blob();

            const url =
                URL.createObjectURL(blob);

            const a =
                document.createElement("a");

            a.href = url;

            a.download =
                pendingDownload.key
                    .split("/")
                    .pop();

            document.body.appendChild(a);

            a.click();

            a.remove();

            URL.revokeObjectURL(url);
        }

        closeModal();

    } catch (e) {

        error.textContent =
            "❌ " + e.message;
    }

}


/* =========================
   MODAL
   ========================= */

function closeModal() {

    document.getElementById("pinModal").style.display = "none";

    pendingDownload = null;

}

</script>

</body>
</html>
